<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>بوابة المدرب · إدارة النادي</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #060911;
            --surface: #0f172a;
            --border: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #3b82f6;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --radius-lg: 20px;
            --radius-md: 12px;
            font-family: 'Tajawal', Tahoma, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            transition: all .25s ease;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--bg-base);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 36px;
            border-bottom: 1px solid var(--border);
            background: rgba(15,23,42,.85);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 800;
            font-size: 1.25rem;
            color: #60a5fa;
        }

        main {
            flex: 1;
            max-width: 600px;
            margin: 0 auto;
            padding: 32px 20px;
            width: 100%;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 32px;
            box-shadow: 0 20px 25px -5px rgba(0,0,0,.4);
            margin-bottom: 24px;
        }

        .card-title {
            font-size: 1.2rem;
            font-weight: 700;
            margin: 0 0 20px;
        }

        input, button {
            font: inherit;
            width: 100%;
            padding: 15px 18px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border);
            background: #0b1329;
            color: var(--text-main);
            margin-block-end: 16px;
        }

            input:focus {
                outline: none;
                border-color: var(--primary);
                box-shadow: 0 0 0 4px rgba(59,130,246,.2);
            }

        button {
            background: var(--primary);
            border: none;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(59,130,246,.35);
        }

            button:hover {
                background: #2563eb;
                transform: translateY(-1px);
            }

            button.ghost {
                background: transparent;
                border: 1px solid var(--border);
                color: var(--text-muted);
                width: auto;
                margin: 0;
                padding: 8px 16px;
                box-shadow: none;
            }

        .tabs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab {
            margin: 0;
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text-muted);
            box-shadow: none;
        }

            .tab.active {
                background: var(--primary);
                color: #fff;
                border-color: var(--primary);
            }

        #reader {
            width: 100%;
            min-height: 280px;
            border-radius: var(--radius-md);
            overflow: hidden;
            margin-block-end: 16px;
            border: 2px dashed var(--border);
            background: #050811;
            display: flex;
            align-items: center;
            justify-content: center;
        }

            #reader video {
                width: 100% !important;
                height: auto !important;
                object-fit: cover;
                border-radius: var(--radius-md);
            }

            #reader:empty {
                display: none;
            }

        .panel {
            border-radius: var(--radius-lg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 30px;
            background: var(--surface);
            border: 1px solid var(--border);
        }

            .panel.Green {
                background: linear-gradient(135deg,#064e3b,#047857);
                border-color: var(--success);
            }

            .panel.Yellow {
                background: linear-gradient(135deg,#78350f,#b45309);
                border-color: var(--warning);
            }

            .panel.Red {
                background: linear-gradient(135deg,#7f1d1d,#b91c1c);
                border-color: var(--danger);
            }

        #icon {
            font-size: 5.5rem;
            line-height: 1;
            margin-bottom: 16px;
        }

        #message {
            font-size: 2.4rem;
            font-weight: 900;
            margin-block-start: 8px;
        }

        #name {
            font-size: 1.7rem;
            font-weight: 700;
            margin-block-start: 16px;
        }

        .chips {
            display: grid;
            grid-template-columns: repeat(4,1fr);
            gap: 8px;
            margin-bottom: 16px;
        }

        .chip {
            margin: 0;
            padding: 10px 4px;
            background: #0b1329;
            border: 1px solid var(--border);
            box-shadow: none;
            font-weight: 500;
        }

            .chip.active {
                border-color: var(--primary);
                box-shadow: 0 0 0 3px rgba(59,130,246,.25);
            }

            .chip strong {
                display: block;
                font-size: 1.3rem;
            }

            .chip small {
                color: var(--text-muted);
            }

            .chip.g strong {
                color: var(--success);
            }

            .chip.y strong {
                color: var(--warning);
            }

            .chip.r strong {
                color: var(--danger);
            }

        .item {
            display: flex;
            align-items: center;
            gap: 14px;
            background: #0b1329;
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 12px 14px;
            margin-bottom: 8px;
        }

        .dot {
            flex: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 1.2rem;
            color: #fff;
        }

            .dot.Green {
                background: var(--success);
            }

            .dot.Yellow {
                background: var(--warning);
                color: #1b1f24;
            }

            .dot.Red {
                background: var(--danger);
            }

        .main {
            flex: 1;
            min-width: 0;
        }

            .main .nm {
                font-weight: 700;
            }

            .main .sub {
                color: var(--text-muted);
                font-size: .88rem;
            }

        .time {
            flex: none;
            font-weight: 700;
        }

        .hidden {
            display: none !important;
        }

        .muted {
            color: var(--text-muted);
            font-size: .92rem;
            text-align: center;
        }

        .error {
            color: var(--danger);
            text-align: center;
            font-weight: 500;
            margin-top: 10px;
        }

        @media (max-width:768px) {
            header {
                padding: 15px;
            }

            main {
                padding: 15px;
            }

            .card {
                padding: 20px 15px;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo-area"><span>💪</span> بوابة المدرب</div>
        <button id="logout" class="ghost hidden">تسجيل خروج</button>
    </header>

    <main>
        <section id="login" class="card">
            <h2 class="card-title" style="text-align:center;">تسجيل دخول المدرب</h2>
            <input id="user" placeholder="اسم المستخدم" autocomplete="username">
            <input id="pass" type="password" placeholder="كلمة المرور" autocomplete="current-password">
            <button id="loginBtn">دخول للنظام</button>
            <p id="loginError" class="error"></p>
        </section>

        <div id="app" class="hidden">
            <div class="tabs">
                <button id="tabScan" class="tab active">📷 المسح</button>
                <button id="tabHistory" class="tab">📊 سجل الحضور</button>
            </div>

            <div id="viewScan">
                <section class="card">
                    <h3 class="card-title">📷 مسح رمز الاستجابة السريعة</h3>
                    <div id="reader"></div>
                    <button id="camBtn">تشغيل كاميرا المسح</button>
                    <p id="notice" class="muted"></p>
                    <input id="token" placeholder="أو أدخل أو امسح الرمز يدوياً هنا..." autocomplete="off">
                </section>
                <div id="result" class="panel">
                    <div id="icon">🛡️</div>
                    <div id="message">جاهز للمسح</div>
                    <div id="name"></div>
                </div>
            </div>

            <section id="viewHistory" class="card hidden">
                <h3 class="card-title">📊 سجل الحضور</h3>
                <input type="date" id="logDate">
                <div class="chips">
                    <button class="chip active" data-colour="All"><strong id="cAll">0</strong><small>الكل</small></button>
                    <button class="chip g" data-colour="Green"><strong id="cGreen">0</strong><small>✓ أخضر</small></button>
                    <button class="chip y" data-colour="Yellow"><strong id="cYellow">0</strong><small>! أصفر</small></button>
                    <button class="chip r" data-colour="Red"><strong id="cRed">0</strong><small>✕ أحمر</small></button>
                </div>
                <div id="list"></div>
                <p id="empty" class="muted"></p>
            </section>
        </div>
    </main>

    <script src="/html5-qrcode.min.js"></script>
    <script>
        const MESSAGES = { Welcome: 'أهلاً بك', PaymentDue: 'يجب الدفع', EndingSoon: 'الاشتراك ينتهي قريباً', NotValid: 'الاشتراك غير صالح', UnknownQr: 'الرمز غير معروف' };
        const ICONS = { Green: '✓', Yellow: '!', Red: '✕' };
        const $ = id => document.getElementById(id);
        const getToken = () => sessionStorage.getItem('jwt');
        let busy = false, resetTimer, qr = null, lastText = '', lastAt = 0;
        let items = [], colour = 'All', tab = 'scan';

        function el(tag, cls, text) {
            const e = document.createElement(tag);
            if (cls) { e.className = cls; }
            if (text !== undefined) { e.textContent = text; }
            return e;
        }

        function gymToday() {
            return new Date().toLocaleDateString('en-CA', { timeZone: 'Asia/Damascus' });
        }

        function timeText(iso) {
            const d = new Date(/Z$|[+-]\d\d:\d\d$/.test(iso) ? iso : iso + 'Z');
            return d.toLocaleTimeString('ar-SY-u-nu-latn', { hour: 'numeric', minute: '2-digit', hour12: true, timeZone: 'Asia/Damascus' });
        }

        function render() {
            const loggedIn = !!getToken();
            $('login').classList.toggle('hidden', loggedIn);
            $('app').classList.toggle('hidden', !loggedIn);
            $('logout').classList.toggle('hidden', !loggedIn);
            if (loggedIn) { idle(); showTab(tab); }
        }

        function showTab(name) {
            tab = name;
            $('viewScan').classList.toggle('hidden', name !== 'scan');
            $('viewHistory').classList.toggle('hidden', name !== 'history');
            $('tabScan').classList.toggle('active', name === 'scan');
            $('tabHistory').classList.toggle('active', name === 'history');
            if (name === 'scan') { $('token').focus(); }
            else { stopCamera(); loadLogs(false); }
        }

        function idle() {
            $('result').className = 'panel';
            $('icon').textContent = '🛡️';
            $('message').textContent = 'جاهز للمسح';
            $('name').textContent = '';
        }

        async function login() {
            $('loginError').textContent = '';
            try {
                const res = await fetch('/api/Auth/Login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userName: $('user').value, password: $('pass').value })
                });
                if (res.status === 429) { $('loginError').textContent = 'محاولات كثيرة، انتظر دقيقة ثم أعد المحاولة'; return; }
                if (!res.ok) { $('loginError').textContent = 'اسم المستخدم أو كلمة المرور غير صحيحة'; return; }
                sessionStorage.setItem('jwt', (await res.json()).token);
                $('pass').value = '';
                render();
            } catch (err) { $('loginError').textContent = 'تعذر الاتصال بالخادم'; }
        }

        async function logout() {
            await stopCamera();
            sessionStorage.removeItem('jwt');
            tab = 'scan';
            render();
        }

        async function scan(qrToken) {
            if (busy || !qrToken) return;
            busy = true;
            try {
                const res = await fetch('/api/CheckIn/scan', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + getToken() },
                    body: JSON.stringify({ qrToken: qrToken })
                });
                if (res.status === 401) { await logout(); return; }
                if (!res.ok) throw new Error('HTTP ' + res.status);
                show(await res.json());
            } catch (err) {
                console.error('scan failed:', err);
                $('result').className = 'panel';
                $('icon').textContent = '⚠';
                $('message').textContent = 'تعذر الاتصال بالخادم';
                $('name').textContent = '';
            } finally {
                busy = false;
                $('token').value = '';
                if (!qr) { $('token').focus(); }
            }
        }

        function show(d) {
            const status = d.result || 'Red';
            $('result').className = 'panel ' + status;
            $('icon').textContent = ICONS[status] || '✕';
            $('message').textContent = MESSAGES[d.messageCode] || 'نتيجة الفحص';
            $('name').textContent = d.memberName || '';
            if (navigator.vibrate) { navigator.vibrate(status === 'Green' ? 80 : [120, 60, 120]); }
            clearTimeout(resetTimer);
            resetTimer = setTimeout(idle, 10000);
        }

        function onCode(text) {
            const now = Date.now();
            if (text === lastText && now - lastAt < 10000) return;
            lastText = text; lastAt = now;
            scan(text.trim());
        }

        async function startCamera() {
            $('notice').textContent = '';
            if (!window.Html5Qrcode) { $('notice').textContent = 'مكتبة الكاميرا غير محملة'; return; }
            try {
                if (!qr) qr = new Html5Qrcode('reader');
                if (qr.isScanning) return;
                await qr.start({ facingMode: 'environment' }, { fps: 15, qrbox: { width: 250, height: 250 } }, onCode, function () { });
                $('camBtn').textContent = 'إيقاف الكاميرا';
            } catch (err) {
                console.error('camera failed:', err);
                $('notice').textContent = 'تعذر تشغيل الكاميرا';
                qr = null;
            }
        }

        async function stopCamera() {
            if (!qr) return;
            try { if (qr.isScanning) await qr.stop(); await qr.clear(); } catch (e) { }
            qr = null;
            $('camBtn').textContent = 'تشغيل كاميرا المسح';
        }

        function rowFor(i) {
            const item = el('div', 'item');
            item.appendChild(el('div', 'dot ' + i.result, ICONS[i.result] || '?'));
            const main = el('div', 'main');
            main.appendChild(el('div', 'nm', i.memberName));
            const parts = [];
            if (i.planName) { parts.push(i.planName); }
            if (i.coachName) { parts.push('المدرب: ' + i.coachName); }
            main.appendChild(el('div', 'sub', parts.length ? parts.join(' · ') : 'لا يوجد اشتراك'));
            item.appendChild(main);
            item.appendChild(el('div', 'time', timeText(i.checkedInAtUtc)));
            return item;
        }

        function renderLogs() {
            const count = function (c) { return items.filter(function (i) { return i.result === c; }).length; };
            $('cAll').textContent = items.length;
            $('cGreen').textContent = count('Green');
            $('cYellow').textContent = count('Yellow');
            $('cRed').textContent = count('Red');
            const rows = items.filter(function (i) { return colour === 'All' || i.result === colour; });
            $('list').innerHTML = '';
            $('empty').textContent = rows.length ? '' : 'لا توجد زيارات مطابقة';
            rows.forEach(function (i) { $('list').appendChild(rowFor(i)); });
        }

        async function loadLogs(quiet) {
            if (!quiet) { $('list').innerHTML = ''; $('empty').textContent = 'جاري التحميل...'; }
            try {
                const res = await fetch('/api/CheckIn/logs?date=' + $('logDate').value, {
                    headers: { 'Authorization': 'Bearer ' + getToken() }
                });
                if (res.status === 401) { await logout(); return; }
                if (res.status === 403) { $('empty').textContent = 'هذا الحساب لا يملك صلاحية عرض السجل'; return; }
                if (!res.ok) throw new Error('HTTP ' + res.status);
                items = await res.json();
                renderLogs();
            } catch (err) {
                console.error('logs failed:', err);
                if (!quiet) { $('empty').textContent = 'تعذر جلب السجل'; }
            }
        }

        $('logDate').value = gymToday();
        $('loginBtn').addEventListener('click', login);
        $('pass').addEventListener('keydown', function (e) { if (e.key === 'Enter') login(); });
        $('token').addEventListener('keydown', function (e) { if (e.key === 'Enter') scan($('token').value.trim()); });
        $('camBtn').addEventListener('click', function () { return qr && qr.isScanning ? stopCamera() : startCamera(); });
        $('logout').addEventListener('click', logout);
        $('tabScan').addEventListener('click', function () { showTab('scan'); });
        $('tabHistory').addEventListener('click', function () { showTab('history'); });
        $('logDate').addEventListener('change', function () { loadLogs(false); });
        document.querySelectorAll('.chip').forEach(function (b) {
            b.addEventListener('click', function () {
                colour = b.dataset.colour;
                document.querySelectorAll('.chip').forEach(function (x) { x.classList.toggle('active', x === b); });
                renderLogs();
            });
        });
        setInterval(function () {
            if (!document.hidden && getToken() && tab === 'history' && $('logDate').value === gymToday()) { loadLogs(true); }
        }, 10000);

        render();
    </script>
</body>
</html>
