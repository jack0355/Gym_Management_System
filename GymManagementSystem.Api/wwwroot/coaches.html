<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>إحصائيات المدربين · إدارة النادي</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #060911;
            --surface: #0f172a;
            --border: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #3b82f6;
            --success: #10b981;
            --radius-lg: 20px;
            --radius-md: 12px;
            font-family: 'Tajawal', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background: var(--bg-base);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 36px;
            border-bottom: 1px solid var(--border);
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(16px);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 800;
            font-size: 1.25rem;
            color: #60a5fa;
        }

        .nav-actions {
            display: flex;
            gap: 12px;
        }

        .nav-btn {
            color: var(--text-muted);
            text-decoration: none;
            border: 1px solid var(--border);
            padding: 8px 16px;
            border-radius: var(--radius-md);
            font-size: 0.95rem;
            transition: 0.2s;
            background: transparent;
            cursor: pointer;
        }

            .nav-btn:hover {
                background: var(--surface);
                color: var(--text-main);
                border-color: var(--primary);
            }

        main {
            flex: 1;
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            padding: 32px 20px;
        }

        .page-title {
            margin-bottom: 24px;
            font-size: 1.8rem;
            font-weight: 800;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 24px;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 24px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            transition: transform 0.2s, border-color 0.2s;
        }

            .card:hover {
                transform: translateY(-5px);
                border-color: var(--primary);
            }

        .coach-icon {
            font-size: 3.5rem;
            margin-bottom: 12px;
        }

        .coach-name {
            font-size: 1.5rem;
            font-weight: 800;
            margin-bottom: 6px;
        }

        .coach-gender {
            font-size: 0.95rem;
            color: var(--text-muted);
            margin-bottom: 20px;
        }

        .stat-box {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            padding: 16px;
            border-radius: var(--radius-md);
            width: 100%;
        }

        .stat-number {
            font-size: 2.8rem;
            font-weight: 900;
            color: var(--success);
            line-height: 1;
        }

        .stat-label {
            font-size: 0.9rem;
            color: #34d399;
            margin-top: 6px;
            font-weight: 600;
        }

        #loading {
            text-align: center;
            color: var(--text-muted);
            margin-top: 60px;
            font-size: 1.2rem;
        }

        @media (max-width: 768px) {
            header {
                flex-direction: column;
                padding: 15px;
                gap: 15px;
            }

            .nav-actions {
                width: 100%;
                justify-content: center;
            }

            main {
                padding: 20px 15px;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo-area">
            <span>📊</span> إحصائيات المدربين
        </div>
        <div class="nav-actions">
            <button class="nav-btn" onclick="location.href='index.html'">← بوابة الفحص</button>
            <button class="nav-btn" onclick="location.href='members.html'">إدارة المشتركين</button>
        </div>
    </header>

    <main>
        <div id="loading">جاري تحميل البيانات...</div>
        <div id="coachesGrid" class="grid"></div>
    </main>

    <script>
        const getToken = () => sessionStorage.getItem('jwt');

        if (!getToken()) {
        if (!getToken()) {
            window.location.href = 'index.html';
        }

        async function loadStats() {
            try {
                const res = await fetch('/api/Coaches/stats', {
                    headers: { 'Authorization': 'Bearer ' + getToken() }
                });

                if (res.status === 401) {
                    sessionStorage.removeItem('jwt');
                    window.location.href = 'index.html';
                    return;
                }

                if (!res.ok) throw new Error('API Error');

                const coaches = await res.json();
                const grid = document.getElementById('coachesGrid');
                document.getElementById('loading').style.display = 'none';

                if (coaches.length === 0) {
                    document.getElementById('loading').style.display = 'block';
                    document.getElementById('loading').textContent = 'لا يوجد مدربين مسجلين';
                    return;
                }

                coaches.forEach(c => {
                    
                    const isMale = c.gender === 'Male' || c.gender === 1;
                    const genderText = isMale ? 'رجال' : 'نساء';
                    const icon = isMale ? '🏋️‍♂️' : '🤸‍♀️';

                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <div class="coach-icon">${icon}</div>
                        <h2 class="coach-name">${c.name}</h2>
                        <div class="coach-gender">يدرب فئة: ${genderText}</div>
                        <div class="stat-box">
                            <div class="stat-number">${c.activeMembers}</div>
                            <div class="stat-label">مشترك نشط حالياً</div>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            } catch (err) {
                console.error('Failed to load stats:', err);
                document.getElementById('loading').textContent = 'تعذر الاتصال بالخادم';
            }
        }

        loadStats();
    </script>
</body>
</html>
