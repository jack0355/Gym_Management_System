<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>نظام إدارة وفحص الأعضاء الذكي</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #060911;
            --surface: #0f172a;
            --surface-card: #1e293b;
            --border: #334155;
            --border-focus: #3b82f6;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --radius-lg: 20px;
            --radius-md: 12px;
            font-family: 'Tajawal', sans-serif;
        }

        * {
            box-sizing: border-box;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--bg-base);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            background-image: radial-gradient(circle at 10% 20%, rgba(59, 130, 246, 0.07) 0%, transparent 40%), radial-gradient(circle at 90% 80%, rgba(16, 185, 129, 0.05) 0%, transparent 40%);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 36px;
            border-bottom: 1px solid var(--border);
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(16px);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 38px;
            height: 38px;
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }

        header strong {
            font-size: 1.25rem;
            font-weight: 800;
            letter-spacing: -0.3px;
            background: linear-gradient(135deg, #60a5fa, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        main {
            flex: 1;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 32px 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .auth-container {
            max-width: 440px;
            width: 100%;
            margin: 0 auto;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            width: 100%;
            align-items: stretch;
        }

        @media (max-width: 900px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 32px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4), 0 8px 10px -6px rgba(0, 0, 0, 0.4);
        }

        .card-title {
            font-size: 1.2rem;
            font-weight: 700;
            margin-top: 0;
            margin-bottom: 20px;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        input, button {
            font: inherit;
            width: 100%;
            padding: 15px 18px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border);
            background: #0b1329;
            color: var(--text-main);
            margin-block-end: 16px;
        }

            input::placeholder {
                color: var(--text-muted);
                opacity: 0.6;
            }

            input:focus {
                outline: none;
                border-color: var(--border-focus);
                box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.2);
            }

        button {
            background: var(--primary);
            border: none;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(59, 130, 246, 0.35);
        }

            button:hover {
                background: var(--primary-hover);
                transform: translateY(-1px);
            }

            button:active {
                transform: translateY(0);
            }

            button.ghost {
                background: transparent;
                border: 1px solid var(--border);
                width: auto;
                margin: 0;
                padding: 8px 18px;
                box-shadow: none;
                font-size: 0.92rem;
                color: var(--text-muted);
            }

                button.ghost:hover {
                    background: rgba(255, 255, 255, 0.05);
                    color: var(--text-main);
                    border-color: var(--text-muted);
                }

        .muted {
            color: var(--text-muted);
            font-size: .92rem;
            margin: 0 0 16px;
            text-align: center;
        }

        .error {
            color: var(--danger);
            font-size: 0.92rem;
            margin: 8px 0 0;
            text-align: center;
            font-weight: 500;
        }

        #reader {
            width: 100%;
            min-height: 280px;
            border-radius: var(--radius-md);
            overflow: hidden;
            margin-block-end: 16px;
            border: 2px dashed var(--border);
            background: #050811;
            display: flex;
            align-items: center;
            justify-content: center;
        }

            #reader video {
                width: 100% !important;
                height: auto !important;
                object-fit: cover;
                border-radius: var(--radius-md);
            }

            #reader:empty {
                display: none;
            }

        .panel {
            border-radius: var(--radius-lg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 30px;
            background: var(--surface);
            border: 1px solid var(--border);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            min-height: 100%;
        }

            .panel.Green {
                background: linear-gradient(135deg, #064e3b, #047857);
                color: #fff;
                border-color: #10b981;
                box-shadow: 0 20px 40px rgba(16, 185, 129, 0.3);
            }

            .panel.Yellow {
                background: linear-gradient(135deg, #78350f, #b45309);
                color: #fff;
                border-color: #f59e0b;
                box-shadow: 0 20px 40px rgba(245, 158, 11, 0.3);
            }

            .panel.Red {
                background: linear-gradient(135deg, #7f1d1d, #b91c1c);
                color: #fff;
                border-color: #ef4444;
                box-shadow: 0 20px 40px rgba(239, 68, 68, 0.3);
            }

        #icon {
            font-size: 5.5rem;
            line-height: 1;
            margin-bottom: 16px;
            filter: drop-shadow(0 4px 10px rgba(0,0,0,0.3));
        }

        #message {
            font-size: 2.4rem;
            font-weight: 900;
            margin-block-start: 8px;
            letter-spacing: -0.5px;
        }

        #name {
            font-size: 1.7rem;
            font-weight: 700;
            margin-block-start: 16px;
            opacity: 0.98;
        }

        #details {
            font-size: 1.15rem;
            margin-block-start: 12px;
            opacity: .92;
            font-weight: 500;
            line-height: 1.6;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo-area">
            <div class="logo-icon">⚡</div>
            <strong>نظام إدارة اللياقة · بوابة الدخول</strong>
        </div>
        <button id="logout" class="ghost hidden">تسجيل خروج</button>
    </header>
    <main>
        <section id="login" class="card auth-container">
            <h2 class="card-title" style="justify-content: center;">تسجيل دخول الموظف</h2>
            <input id="user" placeholder="اسم المستخدم" autocomplete="username">
            <input id="pass" type="password" placeholder="كلمة المرور" autocomplete="current-password">
            <button id="loginBtn">دخول للنظام</button>
            <p id="loginError" class="error"></p>
        </section>

        <div id="scannerWrapper" class="dashboard-grid hidden">
            <section class="card" style="margin: 0;">
                <h3 class="card-title">📷 مسح رمز الاستجابة السريعة</h3>
                <div id="reader"></div>
                <button id="camBtn">تشغيل كاميرا المسح</button>
                <p id="notice" class="muted"></p>
                <input id="token" placeholder="أو أدخل أو امسح الرمز يدوياً هنا..." autocomplete="off">
            </section>

            <div id="result" class="panel">
                <div id="icon">🛡️</div>
                <div id="message">جاهز للمسح</div>
                <div id="name"></div>
                <div id="details">قم بتوجيه الكاميرا نحو رمز العضو أو أدخل الرمز يدوياً للتحقق من حالة الاشتراك</div>
            </div>
        </div>
    </main>

    <script src="/html5-qrcode.min.js"></script>
    <script>
        const MESSAGES = {
            Welcome: 'أهلاً بك',
            PaymentDue: 'يجب الدفع',
            EndingSoon: 'الاشتراك ينتهي قريباً',
            NotValid: 'الاشتراك غير صالح',
            UnknownQr: 'الرمز غير معروف'
        };
        const ICONS = { Green: '✓', Yellow: '!', Red: '✕' };

        const $ = id => document.getElementById(id);
        const getToken = () => sessionStorage.getItem('jwt');
        let busy = false, resetTimer, qr = null, lastText = '', lastAt = 0;

        function render() {
            const loggedIn = !!getToken();
            $('login').classList.toggle('hidden', loggedIn);
            $('scannerWrapper').classList.toggle('hidden', !loggedIn);
            $('logout').classList.toggle('hidden', !loggedIn);
            if (loggedIn) { idle(); $('token').focus(); }
        }

        function idle() {
            $('result').className = 'panel';
            $('icon').textContent = '🛡️';
            $('message').textContent = 'جاهز للمسح';
            $('name').textContent = '';
            $('details').textContent = 'قم بتوجيه الكاميرا نحو رمز العضو أو أدخل الرمز يدوياً للتحقق من حالة الاشتراك';
        }

        async function login() {
            $('loginError').textContent = '';
            try {
                const res = await fetch('/api/Auth/Login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userName: $('user').value, password: $('pass').value })
                });
                if (!res.ok) { $('loginError').textContent = 'اسم المستخدم أو كلمة المرور غير صحيحة'; return; }
                sessionStorage.setItem('jwt', (await res.json()).token);
                $('pass').value = '';
                render();
            } catch (err) {
                $('loginError').textContent = 'تعذر الاتصال بالخادم';
            }
        }

        async function logout() {
            await stopCamera();
            sessionStorage.removeItem('jwt');
            render();
        }

        async function scan(qrToken) {
            if (busy || !qrToken) return;
            busy = true;
            try {
                const res = await fetch('/api/CheckIn/scan', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + getToken() },
                    body: JSON.stringify({ qrToken })
                });
                if (res.status === 401) { await logout(); return; }
                if (!res.ok) throw new Error('HTTP ' + res.status);
                show(await res.json());
            } catch (err) {
                $('result').className = 'panel Red';
                $('icon').textContent = ICONS['Red'];
                $('message').textContent = 'خطأ في الاتصال';
                $('name').textContent = '';
                $('details').textContent = 'تعذر معالجة طلب الفحص مع الخادم';
            } finally {
                busy = false;
                $('token').value = '';
                if (!qr) $('token').focus();
            }
        }

        function show(d) {
            $('result').className = 'panel ' + (d.result || 'Red');
            $('icon').textContent = ICONS[d.result] ?? '✕';
            $('message').textContent = MESSAGES[d.messageCode] ?? d.messageCode ?? 'نتيجة الفحص';
            $('name').textContent = d.memberName || '';
            const parts = [];
            if (d.planName) parts.push(d.planName);
            if (d.endDate) {
                const date = new Date(d.endDate + 'T00:00:00');
                parts.push('ينتهي: ' + date.toLocaleDateString('ar-SA', { day: 'numeric', month: 'long', year: 'numeric' }));
            }
            if (d.amountOwed > 0) parts.push('المتبقي: ' + d.amountOwed);
            $('details').textContent = parts.join(' • ');
            if (navigator.vibrate) navigator.vibrate(d.result === 'Green' ? 80 : [120, 60, 120]);
            clearTimeout(resetTimer);
            resetTimer = setTimeout(idle, 10000);
        }

        function onCode(text) {
            const now = Date.now();
            if (text === lastText && now - lastAt < 3000) return;
            lastText = text; lastAt = now;
            scan(text.trim());
        }

        async function startCamera() {
            $('notice').textContent = '';
            if (!window.Html5Qrcode) {
                $('notice').textContent = 'مكتبة الكاميرا غير محملة';
                return;
            }

            try {
                if (!qr) {
                    qr = new Html5Qrcode('reader');
                }
                if (qr.isScanning) {
                    return;
                }

                await qr.start(
                    { facingMode: 'environment' },
                    { fps: 15, qrbox: { width: 250, height: 250 } },
                    onCode,
                    () => { }
                );
                $('camBtn').textContent = 'إيقاف الكاميرا';
            } catch (err) {
                $('notice').textContent = 'تعذر تشغيل الكاميرا، تأكد من أذونات المتصفح ومتصفح آمن';
                qr = null;
            }
        }

        async function stopCamera() {
            if (!qr) return;
            try {
                if (qr.isScanning) {
                    await qr.stop();
                }
                await qr.clear();
            } catch (err) {
                console.error(err);
            }
            qr = null;
            $('camBtn').textContent = 'تشغيل كاميرا المسح';
        }

        $('loginBtn').addEventListener('click', login);
        $('pass').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
        $('token').addEventListener('keydown', e => { if (e.key === 'Enter') scan($('token').value.trim()); });
        $('camBtn').addEventListener('click', () => qr && qr.isScanning ? stopCamera() : startCamera());
        $('logout').addEventListener('click', logout);
        render();
    </script>
</body>
</html>
